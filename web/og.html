<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Source for the 1200x630 social-share image (og.png). Render at 1200x630 and screenshot. -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
      background: #0b0c0e; color: #ECEEF0; position: relative;
      font-family: 'Inter', sans-serif; padding: 90px; display: flex;
      flex-direction: column; justify-content: center;
    }
    .aurora {
      position: absolute; inset: 0; z-index: 0; overflow: hidden; filter: blur(70px);
    }
    .b1 { position: absolute; width: 520px; height: 520px; border-radius: 50%; top: -120px; right: 40px;
          background: radial-gradient(circle at 40% 40%, #6ee7b7, transparent 70%); opacity: .55; }
    .b2 { position: absolute; width: 420px; height: 420px; border-radius: 50%; bottom: -140px; right: 280px;
          background: radial-gradient(circle at 50% 50%, #22d3ee, transparent 70%); opacity: .45; }
    .wrap { position: relative; z-index: 1; }
    .eyebrow { font-family: 'JetBrains Mono', monospace; color: #6ee7b7; font-size: 22px;
               letter-spacing: 4px; text-transform: uppercase; margin-bottom: 26px; }
    h1 { font-size: 66px; font-weight: 700; line-height: 1.08; letter-spacing: -1.5px; max-width: 900px; }
    h1 .accent { color: #6ee7b7; }
    p { color: #8b929c; font-size: 26px; margin-top: 28px; max-width: 820px; }
    .name { position: absolute; bottom: 70px; left: 90px; z-index: 1;
            font-family: 'JetBrains Mono', monospace; color: #ECEEF0; font-size: 24px; letter-spacing: 1px; }
    .tools { position: absolute; bottom: 70px; right: 90px; z-index: 1;
             font-family: 'JetBrains Mono', monospace; color: #8b929c; font-size: 20px; }
  </style>
</head>
<body>
  <div class="aurora"><span class="b1"></span><span class="b2"></span></div>
  <div class="wrap">
    <p class="eyebrow">AI &amp; Automation Engineer</p>
    <h1>Marketing data into <span class="accent">automated pipelines</span> that tell the truth.</h1>
    <p>AI-powered automation &amp; data pipelines for marketing &amp; growth teams.</p>
  </div>
  <div class="name">Vince Macaraig</div>
  <div class="tools">n8n · Python · SQL</div>
</body>
</html>
